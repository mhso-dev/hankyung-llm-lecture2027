<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">임베딩 캐시 — 입력을 결정하는 네 항목이 모두 같아야 재사용한다</title>
<desc id="desc">본문 해시, 임베딩 모델, 벡터 차원, 전처리 버전으로 캐시 키를 만들고 일치하면 히트, 하나라도 다르면 미스로 분기하는 흐름</desc>
<defs>
<marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a9eed"/></marker>
<marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker>
<marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
<marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker>
<marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#757575"/></marker>
</defs>
<rect width="900" height="470" fill="#ffffff"/>
<text x="20" y="30.0" font-size="18" fill="#1e1e1e" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">임베딩 캐시 — 입력을 결정하는 네 항목이 모두 같아야 재사용한다</tspan></text>
<rect x="45" y="80" width="170" height="60" rx="10" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
<text x="130.0" y="110.0" font-size="16" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="130.0" dy="0.0">본문 해시</tspan></text>
<rect x="45" y="155" width="170" height="60" rx="10" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
<text x="130.0" y="185.0" font-size="16" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="130.0" dy="0.0">임베딩 모델</tspan></text>
<rect x="45" y="230" width="170" height="60" rx="10" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
<text x="130.0" y="260.0" font-size="16" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="130.0" dy="0.0">벡터 차원</tspan></text>
<rect x="45" y="305" width="170" height="60" rx="10" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
<text x="130.0" y="335.0" font-size="16" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="130.0" dy="0.0">전처리 버전</tspan></text>
<polyline points="215,110 350,220" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#m-green)"/>
<polyline points="215,185 350,220" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#m-green)"/>
<polyline points="215,260 350,220" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#m-green)"/>
<polyline points="215,335 350,220" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#m-green)"/>
<rect x="350" y="175" width="180" height="90" rx="10" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
<text x="440.0" y="210.6" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="440.0" dy="0.0">캐시 키</tspan><tspan x="440.0" dy="18.9">(text, model, dim, version)</tspan></text>
<polyline points="530,200 650,125" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#m-green)"/>
<rect x="550.8" y="140.0" width="78.5" height="21.0" fill="#ffffff" fill-opacity="0.94" rx="4"/>
<text x="590.0" y="150.5" font-size="14" fill="#166534" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="590.0" dy="0.0">완전 일치</tspan></text>
<polyline points="530,240 650,320" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#m-red)"/>
<rect x="537.5" y="257.5" width="105.1" height="21.0" fill="#ffffff" fill-opacity="0.94" rx="4"/>
<text x="590.0" y="268.0" font-size="14" fill="#991b1b" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="590.0" dy="0.0">하나라도 변경</tspan></text>
<rect x="650" y="85" width="200" height="80" rx="10" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
<text x="750.0" y="115.5" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="750.0" dy="0.0">캐시 히트</tspan><tspan x="750.0" dy="18.9">저장한 벡터 재사용</tspan></text>
<rect x="650" y="280" width="200" height="80" rx="10" fill="#ffc9c9" stroke="#ef4444" stroke-width="2"/>
<text x="750.0" y="310.6" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="750.0" dy="0.0">캐시 미스</tspan><tspan x="750.0" dy="18.9">새 임베딩 계산·저장</tspan></text>
<text x="450" y="425.0" font-size="14" fill="#595959" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450" dy="0.0">키에 전처리 버전이 빠지면 본문 정제 규칙이 바뀌어도 오래된 벡터가 반환될 수 있습니다.</tspan></text>
</svg>