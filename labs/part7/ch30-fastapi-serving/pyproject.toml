[project]
name = "ch30-fastapi-serving"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi[standard-no-fastapi-cloud-cli]==0.135.0",
  "httpx==0.28.1",
  "langchain==1.4.0",
  "langchain-openai==1.6.0",
  "langgraph==1.2.11",
  "pydantic==2.12.5",
  "python-dotenv==1.2.1",
]

[dependency-groups]
dev = [
    "ipykernel==7.3.0",
    "nbclient==0.11.0",
    "pip==26.2",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
