name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --dev
      - run: uv run ruff check cicd_demo.py server.py tests scripts
      - run: uv run python -m pytest
      - run: uv run python -m build
      - run: uv run python scripts/evaluate_regression.py
