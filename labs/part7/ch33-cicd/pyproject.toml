[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ch33-cicd-lab"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = []

[tool.setuptools]
py-modules = ["cicd_demo"]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.13.0",
    "build==1.3.0",
    "ipykernel==7.3.0",
    "pip==26.2",
    "nbclient==0.11.0",
]

[tool.ruff]
line-length = 100
