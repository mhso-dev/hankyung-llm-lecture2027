<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 650" style="width:680px;max-width:none;height:auto;display:block;margin:0 auto" role="img" aria-label="보라색 생성자와 평가자는 모두 모델 호출입니다. 코드는 점수 85 이상, 두 번째 실행부터 개선 폭 3 미만, 최대 세 번의 조건을 검사합니다. 계속할 수 있으면 피드백을 생성자에 전달하고, 종료하면 초안과 이유를 남깁니다."><title>보라색 생성자와 평가자는 모두 모델 호출입니다. 코드는 점수 85 이상, 두 번째 실행부터 개선 폭 3 미만, 최대 세 번의 조건을 검사합니다. 계속할 수 있으면 피드백을 생성자에 전달하고, 종료하면 초안과 이유를 남깁니다.</title><defs><marker id="05-흐름-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs><path d="M385,80 L385,116" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#05-흐름-arrow)"/><path d="M385,180 L385,216" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#05-흐름-arrow)"/><path d="M385,280 L385,326" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#05-흐름-arrow)"/><path d="M385,430 L385,541" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#05-흐름-arrow)"/><text x="470.0" y="491" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">종료</text><path d="M180,380 L60,380 L60,150 L216,150" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#05-흐름-arrow)"/><text x="140.0" y="239" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">계속</text><text x="140.0" y="264" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">피드백 반영</text><rect x="220" y="20" width="330" height="60" rx="10" fill="#DDEDE8" stroke="#334155" stroke-width="2"/><text x="385.0" y="56.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">과제·이전 피드백</text><rect x="220" y="120" width="330" height="60" rx="10" fill="#E9E0F3" stroke="#334155" stroke-width="2"/><text x="385.0" y="156.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">생성자 모델</text><rect x="220" y="220" width="330" height="60" rx="10" fill="#E9E0F3" stroke="#334155" stroke-width="2"/><text x="385.0" y="256.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">평가자 모델</text><rect x="180" y="330" width="410" height="100" rx="10" fill="#DDEAF4" stroke="#334155" stroke-width="2"/><text x="385.0" y="361.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">정지 조건 검사</text><text x="385.0" y="386.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">85점 이상 / 개선 3점 미만</text><text x="385.0" y="411.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">최대 세 번</text><rect x="200" y="545" width="370" height="65" rx="10" fill="#DDEDE8" stroke="#334155" stroke-width="2"/><text x="385.0" y="584.0" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">최종 초안·점수·종료 이유</text></svg>