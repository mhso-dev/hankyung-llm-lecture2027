<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 510" style="width:700px;max-width:none;height:auto;display:block;margin:0 auto" role="img" aria-label="왼쪽은 공통 사실을 목적·절차·지원으로 나누어 동시에 작성한 뒤 결과를 모으는 섹셔닝입니다. 오른쪽은 같은 후보 A·B를 여러 평가자가 검토하는 별도 투표 실험입니다. A·B 득표수와 tie·refuse 원자료를 구분합니다."><title>왼쪽은 공통 사실을 목적·절차·지원으로 나누어 동시에 작성한 뒤 결과를 모으는 섹셔닝입니다. 오른쪽은 같은 후보 A·B를 여러 평가자가 검토하는 별도 투표 실험입니다. A·B 득표수와 tie·refuse 원자료를 구분합니다.</title><defs><marker id="03-흐름-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs><path d="M175,80 L175,126" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#03-흐름-arrow)"/><path d="M175,205 L175,261" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#03-흐름-arrow)"/><path d="M525,80 L525,126" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#03-흐름-arrow)"/><path d="M525,205 L525,261" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#03-흐름-arrow)"/><path d="M525,325 L525,381" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#03-흐름-arrow)"/><rect x="20" y="20" width="310" height="60" rx="10" fill="#DDEDE8" stroke="#334155" stroke-width="2"/><text x="175.0" y="56.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">섹셔닝: 공통 사실</text><rect x="20" y="130" width="310" height="75" rx="10" fill="#E9E0F3" stroke="#334155" stroke-width="2"/><text x="175.0" y="161.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">목적·절차·지원</text><text x="175.0" y="186.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">세 모델 동시 호출</text><rect x="20" y="265" width="310" height="60" rx="10" fill="#DDEAF4" stroke="#334155" stroke-width="2"/><text x="175.0" y="301.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">gather 결과 목록</text><rect x="370" y="20" width="310" height="60" rx="10" fill="#DDEDE8" stroke="#334155" stroke-width="2"/><text x="525.0" y="56.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">투표: 같은 후보 A·B</text><rect x="370" y="130" width="310" height="75" rx="10" fill="#E9E0F3" stroke="#334155" stroke-width="2"/><text x="525.0" y="161.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">서로 다른 기준의</text><text x="525.0" y="186.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">세 평가 모델 동시 호출</text><rect x="370" y="265" width="310" height="60" rx="10" fill="#DDEAF4" stroke="#334155" stroke-width="2"/><text x="525.0" y="301.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">A·B만 득표수 집계</text><rect x="370" y="385" width="310" height="75" rx="10" fill="#DDEDE8" stroke="#334155" stroke-width="2"/><text x="525.0" y="416.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">tie·refuse 포함</text><text x="525.0" y="441.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">원자료 보존</text></svg>