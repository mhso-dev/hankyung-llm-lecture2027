<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 650" style="width:700px;max-width:none;height:auto;display:block;margin:0 auto" role="img" aria-label="오케스트레이터가 작업 목록을 만들면 코드가 유효한 작업 수를 검사합니다. 유효 작업이 두 개보다 적으면 중단하고, 통과하면 최대 네 개의 워커를 실행합니다. 워커 결과를 종합 모델에 전달합니다."><title>오케스트레이터가 작업 목록을 만들면 코드가 유효한 작업 수를 검사합니다. 유효 작업이 두 개보다 적으면 중단하고, 통과하면 최대 네 개의 워커를 실행합니다. 워커 결과를 종합 모델에 전달합니다.</title><defs><marker id="04-흐름-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs><path d="M350,80 L350,116" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#04-흐름-arrow)"/><path d="M350,180 L350,216" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#04-흐름-arrow)"/><path d="M270,280 L140,280 L140,336" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#04-흐름-arrow)"/><path d="M430,280 L535,280 L535,336" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#04-흐름-arrow)"/><path d="M535,415 L535,461" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#04-흐름-arrow)"/><path d="M535,525 L535,561" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#04-흐름-arrow)"/><rect x="210" y="20" width="280" height="60" rx="10" fill="#DDEDE8" stroke="#334155" stroke-width="2"/><text x="350.0" y="56.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">전체 과제</text><rect x="210" y="120" width="280" height="60" rx="10" fill="#E9E0F3" stroke="#334155" stroke-width="2"/><text x="350.0" y="156.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">동적 계획 모델</text><rect x="210" y="220" width="280" height="60" rx="10" fill="#DDEAF4" stroke="#334155" stroke-width="2"/><text x="350.0" y="256.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">유효 작업 수 검사</text><rect x="10" y="340" width="260" height="60" rx="10" fill="#F4D9D5" stroke="#334155" stroke-width="2"/><text x="140.0" y="376.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">두 개 미만: 중단</text><rect x="390" y="340" width="290" height="75" rx="10" fill="#E9E0F3" stroke="#334155" stroke-width="2"/><text x="535.0" y="371.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">계획 수만큼 워커</text><text x="535.0" y="396.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">최대 네 개</text><rect x="390" y="465" width="290" height="60" rx="10" fill="#DDEDE8" stroke="#334155" stroke-width="2"/><text x="535.0" y="501.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">워커 결과 목록</text><rect x="390" y="565" width="290" height="60" rx="10" fill="#E9E0F3" stroke="#334155" stroke-width="2"/><text x="535.0" y="601.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">종합 모델</text></svg>