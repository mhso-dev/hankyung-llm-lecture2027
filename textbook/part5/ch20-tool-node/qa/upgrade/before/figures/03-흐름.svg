<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 570" style="width:620px;max-width:none;height:auto;display:block;margin:0 auto" role="img" aria-label="tick 실행 뒤 종료 조건을 검사합니다. 종료 조건이 거짓이면 tick을 반복합니다. recursion_limit은 그래프 전체 실행의 단계 수를 제한하며 END 뒤에 실행하는 노드가 아닙니다."><title>tick 실행 뒤 종료 조건을 검사합니다. 종료 조건이 거짓이면 tick을 반복합니다. recursion_limit은 그래프 전체 실행의 단계 수를 제한하며 END 뒤에 실행하는 노드가 아닙니다.</title><defs><marker id="03-흐름-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs><path d="M310,80 L310,116" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#03-흐름-arrow)"/><path d="M310,180 L310,226" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#03-흐름-arrow)"/><path d="M170,260 L60,260 L60,150 L166,150" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#03-흐름-arrow)"/><text x="115.0" y="209" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">계속</text><path d="M390,290 L470,290 L470,376" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#03-흐름-arrow)"/><text x="540.0" y="340" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">종료</text><rect x="170" y="20" width="280" height="60" rx="10" fill="#DDEAF4" stroke="#334155" stroke-width="2"/><text x="310.0" y="56.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">START</text><rect x="170" y="120" width="280" height="60" rx="10" fill="#DDEAF4" stroke="#334155" stroke-width="2"/><text x="310.0" y="156.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">tick: 상태 갱신</text><rect x="170" y="230" width="280" height="60" rx="10" fill="#DDEAF4" stroke="#334155" stroke-width="2"/><text x="310.0" y="266.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">종료 조건 확인</text><rect x="350" y="380" width="240" height="60" rx="10" fill="#DDEAF4" stroke="#334155" stroke-width="2"/><text x="470.0" y="416.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">END</text><rect x="130" y="475" width="360" height="70" rx="10" fill="#F4D9D5" stroke="#334155" stroke-width="2"/><text x="310.0" y="504.0" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">recursion_limit</text><text x="310.0" y="529.0" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">실행 단계 수 제한</text></svg>