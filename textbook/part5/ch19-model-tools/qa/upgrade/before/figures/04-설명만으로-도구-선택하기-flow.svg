<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 530" style="width:380px;max-width:none;height:auto;display:block;margin:0 auto" role="img" aria-label="설명문을 바꾼 두 조건을 각각 실행하고 도구 선택을 비교합니다. 이번 실행에서는 두 조건 모두 세 질문을 세 번씩 실행한 아홉 응답에서 올바른 도구를 선택했습니다."><title>설명문을 바꾼 두 조건을 각각 실행하고 도구 선택을 비교합니다. 이번 실행에서는 두 조건 모두 세 질문을 세 번씩 실행한 아홉 응답에서 올바른 도구를 선택했습니다.</title><defs><marker id="04-설명만으로-도구-선택하기-flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs><path d="M190,85 L190,116" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#04-설명만으로-도구-선택하기-flow-arrow)"/><path d="M190,185 L190,216" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#04-설명만으로-도구-선택하기-flow-arrow)"/><path d="M190,285 L190,316" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#04-설명만으로-도구-선택하기-flow-arrow)"/><path d="M190,385 L190,416" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#04-설명만으로-도구-선택하기-flow-arrow)"/><rect x="30" y="20" width="320" height="65" rx="10" fill="#DDEDE8" stroke="#334155" stroke-width="2"/><text x="190.0" y="59.0" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">같은 질문·모델·도구</text><rect x="30" y="120" width="320" height="65" rx="10" fill="#DDEAF4" stroke="#334155" stroke-width="2"/><text x="190.0" y="159.0" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">설명문만 변경</text><rect x="30" y="220" width="320" height="65" rx="10" fill="#E9E0F3" stroke="#334155" stroke-width="2"/><text x="190.0" y="259.0" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">모델의 도구 선택</text><rect x="30" y="320" width="320" height="65" rx="10" fill="#DDEDE8" stroke="#334155" stroke-width="2"/><text x="190.0" y="359.0" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">선택 이름 기록</text><rect x="30" y="420" width="320" height="65" rx="10" fill="#F7EDC7" stroke="#334155" stroke-width="2"/