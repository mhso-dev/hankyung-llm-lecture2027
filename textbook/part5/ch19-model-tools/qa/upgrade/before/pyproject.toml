[project]
name = "ch19-model-tools"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langchain==1.4.0",
  "langchain-openai==1.6.0",
  "pandas==3.0.5",
  "pydantic==2.12.5",
  "python-dotenv==1.2.3",
]

[dependency-groups]
dev = ["ipykernel==7.3.0", "nbclient==0.11.0", "pip==26.2", "pytest==9.1.1", "ruff==0.15.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
