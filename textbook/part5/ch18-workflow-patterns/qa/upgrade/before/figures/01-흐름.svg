<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 570" style="width:620px;max-width:none;height:auto;display:block;margin:0 auto" role="img" aria-label="요청에서 기획 모델과 게이트로 내려갑니다. 게이트를 통과한 기획만 집필 모델에 전달하고, 조건에 맞지 않으면 추가 모델 호출 전에 중단합니다."><title>요청에서 기획 모델과 게이트로 내려갑니다. 게이트를 통과한 기획만 집필 모델에 전달하고, 조건에 맞지 않으면 추가 모델 호출 전에 중단합니다.</title><defs><marker id="01-흐름-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs><path d="M310,80 L310,116" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#01-흐름-arrow)"/><path d="M310,180 L310,216" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#01-흐름-arrow)"/><path d="M230,280 L150,280 L150,371" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#01-흐름-arrow)"/><text x="80.0" y="329" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">미통과</text><path d="M390,280 L470,280 L470,371" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#01-흐름-arrow)"/><text x="540.0" y="329" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">통과</text><path d="M470,435 L470,486" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#01-흐름-arrow)"/><rect x="170" y="20" width="280" height="60" rx="10" fill="#DDEDE8" stroke="#334155" stroke-width="2"/><text x="310.0" y="56.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">사용자 요청</text><rect x="170" y="120" width="280" height="60" rx="10" fill="#E9E0F3" stroke="#334155" stroke-width="2"/><text x="310.0" y="156.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">기획 모델</text><rect x="170" y="220" width="280" height="60" rx="10" fill="#DDEAF4" stroke="#334155" stroke-width="2"/><text x="310.0" y="256.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">필드·단계 게이트</text><rect x="30" y="375" width="240" height="60" rx="10" fill="#F4D9D5" stroke="#334155" str