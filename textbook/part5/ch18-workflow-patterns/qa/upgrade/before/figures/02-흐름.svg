<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 555" style="width:620px;max-width:none;height:auto;display:block;margin:0 auto" role="img" aria-label="분류 모델의 범주와 신뢰도를 코드에서 검사합니다. 허용 범주이고 신뢰도가 0.75 이상인 경우에만 전문 답변 모델을 호출합니다. 그 밖의 경우에는 추가 구분을 요청합니다."><title>분류 모델의 범주와 신뢰도를 코드에서 검사합니다. 허용 범주이고 신뢰도가 0.75 이상인 경우에만 전문 답변 모델을 호출합니다. 그 밖의 경우에는 추가 구분을 요청합니다.</title><defs><marker id="02-흐름-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs><path d="M310,80 L310,116" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#02-흐름-arrow)"/><path d="M310,180 L310,216" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#02-흐름-arrow)"/><path d="M230,280 L150,280 L150,371" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#02-흐름-arrow)"/><text x="85.0" y="329" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">통과</text><path d="M390,280 L470,280 L470,371" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#02-흐름-arrow)"/><text x="540.0" y="329" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">미통과</text><rect x="170" y="20" width="280" height="60" rx="10" fill="#DDEDE8" stroke="#334155" stroke-width="2"/><text x="310.0" y="56.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">지원 질문</text><rect x="130" y="120" width="360" height="60" rx="10" fill="#E9E0F3" stroke="#334155" stroke-width="2"/><text x="310.0" y="156.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">범주·신뢰도 분류 모델</text><rect x="130" y="220" width="360" height="60" rx="10" fill="#DDEAF4" stroke="#334155" stroke-width="2"/><text x="310.0" y="256.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">허용 목록·신뢰도 검사</text><rect x="30" y="375" width="240" height="75" rx="10" fill="#E9E0F3" stroke="#334155" stroke-width="2"/><text x="150.0" y="406.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">전문 답변 모델</text><text x="150.0" y="431.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">세 범주 중 하나</text><rect x="350" y="375" width="240" height="75" rx="10" fill="#F4D9D5" stroke="#334155" stroke-width="2"/><text x="470.0" y="406.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">추가 구분 요청</text><text x="470.0" y="431.5" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#172033">전문 모델 호출 없음</text></svg>