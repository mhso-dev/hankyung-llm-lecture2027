<svg style="min-width:720px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" role="img"
 aria-labelledby="title-04-rest-pagination desc-04-rest-pagination">
<title id="title-04-rest-pagination">REST 페이지네이션 종료</title>
<desc id="desc-04-rest-pagination">파란 입력에서 노란 처리를 거쳐 초록 결과가 나오며 빨간 상자는 실패 사례를 나타냅니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker></defs>
<rect width="720" height="270" fill="#fff"/>
<text x="24" y="35" font-size="20" font-weight="700" fill="#111827">REST 페이지네이션 종료</text>
<path d="M210 110H265" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M450 110H505" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M360 155V180" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="30" y="75" width="180" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="120.0" y="106.0" text-anchor="middle" font-size="16" fill="#111827">GET page=1</text>
<text x="120.0" y="129.0" text-anchor="middle" font-size="16" fill="#111827">A01·A02</text>
<rect x="270" y="75" width="180" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="360.0" y="106.0" text-anchor="middle" font-size="16" fill="#111827">next_page=2</text>
<text x="360.0" y="129.0" text-anchor="middle" font-size="16" fill="#111827">GET page=2</text>
<rect x="510" y="75" width="180" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="600.0" y="106.0" text-anchor="middle" font-size="16" fill="#111827">3건 확인</text>
<text x="600.0" y="129.0" text-anchor="middle" font-size="16" fill="#111827">next_page=None</text>
<rect x="270" y="185" width="180" height="55" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="360.0" y="203.5" text-anchor="middle" font-size="16" fill="#111827">첫 페이지만 읽음</text>
<text x="360.0" y="226.5" text-anchor="middle" font-size="16" fill="#111827">A03 누락</text>
</svg>