<svg style="min-width:720px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 695" width="720" height="695" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" role="img" aria-labelledby="title-05-secret-response desc-05-secret-response">
<title id="title-05-secret-response">실제 시크릿 유출 시 대응 순서</title>
<desc id="desc-05-secret-response">실제 유출 시 자격 증명을 폐기·교체한 뒤 협업자와 이력 재작성을 조율합니다. 실습은 가상 문자열의 이력 정리·원격 갱신·재검사만 실행합니다.</desc>
<defs>
