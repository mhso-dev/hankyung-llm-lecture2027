<svg style="min-width:800px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 485" width="800" height="485" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" role="img" aria-labelledby="title-05-tool-readiness desc-05-tool-readiness">
<title id="title-05-tool-readiness">설치 여부와 실행 상태를 구분하여 확인한다</title>
<desc id="desc-05-tool-readiness">CLI 설치, 서버 실행, Git 저장소 생성은 서로 다른 준비 상태입니다.</desc>
<defs>
<marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
<marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect width="800" height="485" fill="#ffffff"/>
<text x="20" y="30.0" font-size="19" fill="#111827" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">설치 여부와 실행 상태를 구분하여 확인한다</tspan></text>
<rect x="45" y="105" width="205" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="147.5" y="134.9" font-size="15" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="147.5" dy="0.0">Docker CLI 설치</tspan><tspan x="147.5" dy="20.2">docker --version</tspan></text>
<polyline points="147,185 147,230" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#m-yellow)"/>
<rect x="112.0" y="180.5" width="70.0" height="24" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="147.0" y="192.5" font-size="14" fill="#92400e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="147.0" dy="0.0">명령 확인</tspan></text>
<rect x="45" y="230" width="205" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="147.5" y="264.9" font-size="15" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="147.5" dy="0.0">Docker 서버 실행</tspan><tspan x="147.5" dy="20.2">docker info</tspan></text>
<rect x="350" y="105" width="205" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="452.5" y="134.9" font-size="15" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="452.5" dy="0.0">Git 설치</tspan><tspan x="452.5" dy="20.2">git --version</tspan></text>
<polyline points="452,185 452,230" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
<rect x="410.3" y="180.5" width="83.4" height="24" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="452.0" y="192.5" font-size="14" fill="#1e40af" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="452.0" dy="0.0">git init</tspan></text>
<rect x="350" y="230" width="205" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="452.5" y="264.9" font-size="15" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="452.5" dy="0.0">현재 폴더가 저장소</tspan><tspan x="452.5" dy="20.2">git status</tspan></text>
<rect x="620" y="145" width="140" height="135" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="690.0" y="184.2" font-size="14" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="690.0" dy="0.0">각 상태 기록</tspan><tspan x="690.0" dy="18.9">CLI 응답 여부</tspan><tspan x="690.0" dy="18.9">서버 응답 여부</tspan><tspan x="690.0" dy="18.9">저장소 상태</tspan></text>
<polyline points="250,275 620,220" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#m-yellow)"/>
<polyline points="555,275 620,245" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#m-yellow)"/>
<text x="45" y="375.0" font-size="15" fill="#991b1b" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="45" dy="0.0">Docker CLI가 설치되어도 Docker 서버가 실행 중이라는 뜻은 아닙니다.</tspan></text>
<text x="45" y="420.0" font-size="15" fill="#4b5563" text-anchor="start" dominant-baseline="middle" font-weight="normal"><tspan x="45" dy="0.0">Git이 설치되어도 현재 폴더가 Git 저장소라는 뜻은 아닙니다.</tspan></text>
</svg>