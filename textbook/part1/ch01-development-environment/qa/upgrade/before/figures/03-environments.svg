<svg style="min-width:800px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 465" width="800" height="465" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" role="img" aria-labelledby="title-03-environments desc-03-environments">
<title id="title-03-environments">기본 Python에서 서로 다른 가상환경 두 개를 만든다</title>
<desc id="desc-03-environments">uv venv가 env_a와 env_b를 만들고, 각 환경에서 prefix와 base_prefix가 다른지 확인합니다.</desc>
<defs>
<marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
<marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect width="800" height="465" fill="#ffffff"/>
<text x="20" y="30.0" font-size="19" fill="#111827" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">기본 Python에서 서로 다른 가상환경 두 개를 만든다</tspan></text>
<rect x="295" y="55" width="210" height="65" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="400.0" y="87.5" font-size="16" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="400.0" dy="0.0">기본 Python 3.12</tspan></text>
<polyline points="360,120 205,180" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
<rect x="219.1" y="123.0" width="126.8" height="24" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="282.5" y="135.0" font-size="14" fill="#1e40af" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="282.5" dy="0.0">uv venv env_a</tspan></text>
<polyline points="440,120 595,180" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
<rect x="454.1" y="123.0" width="126.8" height="24" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="517.5" y="135.0" font-size="14" fill="#1e40af" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="517.5" dy="0.0">uv venv env_b</tspan></text>
<rect x="70" y="180" width="270" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="205.0" y="214.9" font-size="15" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="205.0" dy="0.0">env_a</tspan><tspan x="205.0" dy="20.2">env_a / python_name</tspan></text>
<rect x="460" y="180" width="270" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="595.0" y="214.9" font-size="15" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="595.0" dy="0.0">env_b</tspan><tspan x="595.0" dy="20.2">env_b / python_name</tspan></text>
<polyline points="205,270 205,320" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#m-yellow)"/>
<rect x="158.9" y="268.0" width="92.1" height="24" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="205.0" y="280.0" font-size="14" fill="#92400e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="205.0" dy="0.0">prefix 비교</tspan></text>
<polyline points="595,270 595,320" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#m-yellow)"/>
<rect x="548.9" y="268.0" width="92.1" height="24" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="595.0" y="280.0" font-size="14" fill="#92400e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="595.0" dy="0.0">prefix 비교</tspan></text>
<rect x="95" y="320" width="220" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="205.0" y="344.2" font-size="16" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="205.0" dy="0.0">env_a 가상환경</tspan><tspan x="205.0" dy="21.6">True</tspan></text>
<rect x="485" y="320" width="220" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="595.0" y="344.2" font-size="16" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="595.0" dy="0.0">env_b 가상환경</tspan><tspan x="595.0" dy="21.6">True</tspan></text>
<text x="400" y="430.0" font-size="15" fill="#4b5563" text-anchor="middle" dominant-baseline="middle" font-weight="bold"><tspan x="400" dy="0.0">True는 sys.prefix와 sys.base_prefix가 다르다는 뜻입니다.</tspan></text>
</svg>