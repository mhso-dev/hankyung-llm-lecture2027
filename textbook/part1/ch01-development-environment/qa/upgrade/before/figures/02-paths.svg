<svg style="min-width:800px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" role="img" aria-labelledby="title-02-paths desc-02-paths">
<title id="title-02-paths">상대 경로는 선택한 기준 폴더에서 시작한다</title>
<desc id="desc-02-paths">data/message.txt를 workspace에 연결하면 실패하고 practice에 연결하면 저장한 파일을 읽습니다.</desc>
<defs>
<marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
<marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect width="800" height="470" fill="#ffffff"/>
<text x="20" y="30.0" font-size="19" fill="#111827" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">상대 경로는 선택한 기준 폴더에서 시작한다</tspan></text>
<rect x="45" y="105" width="210" height="190" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="150.0" y="169.6" font-size="15" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="150.0" dy="0.0">workspace/</tspan><tspan x="150.0" dy="20.2">└─ practice/</tspan><tspan x="150.0" dy="20.2">   └─ data/</tspan><tspan x="150.0" dy="20.2">      └─ message.txt</tspan></text>
<text x="390" y="82.0" font-size="16" fill="#1e40af" text-anchor="middle" dominant-baseline="middle" font-weight="bold"><tspan x="390" dy="0.0">상대 경로: data/message.txt</tspan></text>
<rect x="300" y="115" width="190" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="395.0" y="139.2" font-size="16" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="395.0" dy="0.0">잘못 선택한 기준</tspan><tspan x="395.0" dy="21.6">workspace</tspan></text>
<polyline points="490,150 555,150" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#m-red)"/>
<rect x="487.5" y="123.0" width="70.0" height="24" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="522.5" y="135.0" font-size="14" fill="#991b1b" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="522.5" dy="0.0">연결</tspan></text>
<rect x="555" y="115" width="195" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="652.5" y="140.6" font-size="14" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="652.5" dy="0.0">workspace/data/message.txt</tspan><tspan x="652.5" dy="18.9">FileNotFoundError</tspan></text>
<rect x="300" y="250" width="190" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="395.0" y="274.2" font-size="16" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="395.0" dy="0.0">올바른 기준</tspan><tspan x="395.0" dy="21.6">project = practice</tspan></text>
<polyline points="490,285 555,285" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#m-green)"/>
<rect x="487.5" y="258.0" width="70.0" height="24" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="522.5" y="270.0" font-size="14" fill="#166534" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="522.5" dy="0.0">연결</tspan></text>
<rect x="555" y="250" width="195" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="652.5" y="275.6" font-size="14" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="652.5" dy="0.0">practice/data/message.txt</tspan><tspan x="652.5" dy="18.9">안녕, 터미널!</tspan></text>
<text x="300" y="380.0" font-size="15" fill="#92400e" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="300" dy="0.0">기준 폴더 이름과 연결한 전체 경로 확인</tspan></text>
<text x="300" y="415.0" font-size="15" fill="#4b5563" text-anchor="start" dominant-baseline="middle" font-weight="normal"><tspan x="300" dy="0.0">같은 상대 경로를 유지하고 기준 폴더만 바꾸어 결과를 비교합니다.</tspan></text>
</svg>