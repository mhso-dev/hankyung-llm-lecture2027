<svg style="min-width:800px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" role="img" aria-labelledby="title-04-debugging desc-04-debugging">
<title id="title-04-debugging">중단점에서 연산 직전과 직후의 값을 확인한다</title>
<desc id="desc-04-debugging">F5로 연산 직전에 멈추고 F10으로 실행한 뒤, 연산자 수정 전후의 total을 비교합니다.</desc>
<defs>
<marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
<marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect width="800" height="500" fill="#ffffff"/>
<text x="20" y="30.0" font-size="19" fill="#111827" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">중단점에서 연산 직전과 직후의 값을 확인한다</tspan></text>
<rect x="35" y="100" width="145" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="107.5" y="134.9" font-size="15" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="107.5" dy="0.0">hello.py 저장</tspan><tspan x="107.5" dy="20.2">F5 누르기</tspan></text>
<polyline points="180,145 210,145" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
<rect x="210" y="100" width="145" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="282.5" y="134.9" font-size="15" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="282.5" dy="0.0">선택한 .venv</tspan><tspan x="282.5" dy="20.2">Python 디버거</tspan></text>
<polyline points="355,145 385,145" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#m-yellow)"/>
<rect x="385" y="75" width="205" height="140" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="487.5" y="107.2" font-size="14" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="487.5" dy="0.0">중단점: 실행 직전</tspan><tspan x="487.5" dy="18.9">total = price + count</tspan><tspan x="487.5" dy="18.9">price: 3000</tspan><tspan x="487.5" dy="18.9">count: 2</tspan><tspan x="487.5" dy="18.9">total: 아직 없음</tspan></text>
<polyline points="590,145 620,145" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#m-red)"/>
<rect x="570.0" y="118.0" width="70.0" height="24" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="605.0" y="130.0" font-size="14" fill="#991b1b" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="605.0" dy="0.0">F10</tspan></text>
<rect x="620" y="100" width="145" height="90" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="692.5" y="134.9" font-size="15" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="692.5" dy="0.0">실행 직후</tspan><tspan x="692.5" dy="20.2">total: 3002</tspan></text>
<polyline points="692,190 692,270 155,270 155,315" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)" stroke-dasharray="7 5"/>
<rect x="381.8" y="225.5" width="83.4" height="24" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="423.5" y="237.5" font-size="14" fill="#1e40af" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="423.5" dy="0.0">+를 *로 변경</tspan></text>
<rect x="35" y="315" width="240" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="155.0" y="355.0" font-size="15" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="155.0" dy="0.0">저장 → F5 → 중단점 → F10</tspan></text>
<polyline points="275,355 365,355" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#m-yellow)"/>
<rect x="285.0" y="328.0" width="70.0" height="24" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="320.0" y="340.0" font-size="14" fill="#92400e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="320.0" dy="0.0">다시 확인</tspan></text>
<rect x="365" y="315" width="205" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="467.5" y="344.9" font-size="15" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="467.5" dy="0.0">실행 직후</tspan><tspan x="467.5" dy="20.2">total: 6000</tspan></text>
<text x="400" y="445.0" font-size="15" fill="#4b5563" text-anchor="middle" dominant-baseline="middle" font-weight="bold"><tspan x="400" dy="0.0">입력값을 유지하고 연산자만 바꾸어 결과 차이를 확인합니다.</tspan></text>
</svg>