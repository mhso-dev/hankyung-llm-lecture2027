<svg style="min-width:900px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" role="img" aria-labelledby="title-08-concept desc-08-concept">
<title id="title-08-concept">실패하는 테스트에서 회귀 테스트까지</title>
<desc id="desc-08-concept">같은 10,000원 입력과 9,000원 기대값을 유지한 채 할인 구현만 수정하여 실패와 통과를 비교합니다.</desc>
<defs>
<marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
<marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect width="900" height="550" fill="#ffffff"/>
<text x="20" y="30.0" font-size="19" fill="#111827" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">실패하는 테스트에서 회귀 테스트까지</tspan></text>
<text x="20" y="72.0" font-size="16" fill="#111827" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">입력과 기대값을 유지하고 구현만 비교합니다</tspan></text>
<rect x="300" y="95" width="300" height="88" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="450.0" y="127.5" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450.0" dy="0.0">같은 테스트</tspan><tspan x="450.0" dy="23.0">입력 10000 · 기대값 9000</tspan></text>
<polyline points="400,183 400,220 205,255" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#m-red)"/>
<rect x="267.5" y="192.0" width="70.0" height="24" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="302.5" y="204.0" font-size="14" fill="#991b1b" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="302.5" dy="0.0">Before</tspan></text>
<polyline points="500,183 500,220 695,255" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
<rect x="562.5" y="192.0" width="70.0" height="24" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="597.5" y="204.0" font-size="14" fill="#1e40af" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="597.5" dy="0.0">After</tspan></text>
<rect x="25" y="255" width="360" height="90" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="205.0" y="288.5" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="205.0" dy="0.0">잘못된 구현</tspan><tspan x="205.0" dy="23.0">int(price × 0.9) + 100</tspan></text>
<polyline points="205,345 205,390" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#m-red)"/>
<rect x="25" y="390" width="360" height="82" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="205.0" y="419.5" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="205.0" dy="0.0">실제값 9100</tspan><tspan x="205.0" dy="23.0">1 failed · 종료 코드 1</tspan></text>
<rect x="515" y="255" width="360" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="695.0" y="288.5" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="695.0" dy="0.0">수정한 구현</tspan><tspan x="695.0" dy="23.0">int(price × 0.9)</tspan></text>
<polyline points="695,345 695,390" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
<rect x="515" y="390" width="360" height="82" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="695.0" y="419.5" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="695.0" dy="0.0">실제값 9000</tspan><tspan x="695.0" dy="23.0">1 passed · 종료 코드 0</tspan></text>
<text x="450.0" y="524.0" font-size="14" fill="#4b5563" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450.0" dy="0.0">파랑: 작성한 흐름 · 초록: 데이터 · 노랑: 확인 · 빨강: 실패</tspan></text>
</svg>