<text x="20" y="240.0" font-size="16" fill="#111827" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">변수 범위</tspan></text>
<rect x="180" y="268" width="540" height="86" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="450.0" y="300.2" font-size="16" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450.0" dy="0.0">함수 밖 label = &quot;주문&quot;</tspan><tspan x="450.0" dy="21.6">함수 안 label = &quot;주문번호 A102&quot; · 호출 뒤 바깥 값은 &quot;주문&quot;</tspan></text>
<text x="20" y="410.0" font-size="16" fill="#111827" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">기본 목록과 None 방식 비교</tspan></text>
