<rect width="900" height="650" fill="#ffffff"/>
<text x="20" y="30.0" font-size="19" fill="#111827" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">함수의 입력과 반환, 호출별 목록</tspan></text>
<text x="20" y="72.0" font-size="16" fill="#111827" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">함수 호출과 반환</tspan></text>
<rect x="25" y="100" width="220" height="82" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="135.0" y="129.5" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="135.0" dy="0.0">인자</tspan><tspan x="135.0" dy="23.0">78000, 0.1</tspan></text>
<polyline points="245,141 335,141" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
<rect x="335" y="100" width="230" height="82" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="450.0" y="130.2" font-size="16" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450.0" dy="0.0">calculate_payment()</tspan><tspan x="450.0" dy="21.6">할인액 계산</tspan></text>
<polyline points="565,141 655,141" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
<rect x="575.0" y="114.0" width="70.0" height="24" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="610.0" y="126.0" font-size="14" fill="#1e40af" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="610.0" dy="0.0">return</tspan></text>
<rect x="655" y="100" width="220" height="82" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
