<text x="452.5" y="481.7" font-size="16" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="452.5" dy="0.0">기본값 None</tspan><tspan x="452.5" dy="21.6">호출마다 새 목록 생성</tspan></text>
<polyline points="570,492 635,492" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
<rect x="635" y="440" width="240" height="105" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="755.0" y="481.0" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="755.0" dy="0.0">서로 다른 객체</tspan><tspan x="755.0" dy="23.0">[신규] / [배송]</tspan></text>
<text x="450.0" y="624.0" font-size="14" fill="#4b5563" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450.0" dy="0.0">파랑: 작성한 흐름 · 초록: 데이터 · 노랑: 확인 · 빨강: 실패</tspan></text>
