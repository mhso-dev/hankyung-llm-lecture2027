<svg style="min-width:900px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" role="img" aria-labelledby="title-11-concept desc-11-concept">
<title id="title-11-concept">패키지 설치를 확인하고 테스트의 준비 상태를 분리합니다</title>
<desc id="desc-11-concept">위쪽은 소스에서 휠·설치 후 실행까지, 아래쪽은 같은 테스트의 목록 상태를 비교합니다.</desc>
<defs>
<marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
<marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect width="900" height="680" fill="#ffffff"/>
<text x="20" y="30.0" font-size="19" fill="#111827" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">패키지 설치를 확인하고 테스트의 준비 상태를 분리합니다</tspan></text>
<rect x="30" y="80" width="250" height="105" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="155.0" y="110.9" font-size="16" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="155.0" dy="0.0">src/report_tools</tspan><tspan x="155.0" dy="21.6">pyproject.toml</tspan><tspan x="155.0" dy="21.6">이름·버전·빌드 시스템</tspan></text>
<polyline points="280,133 325,133" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
<rect x="325" y="80" width="250" height="105" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="450.0" y="121.7" font-size="16" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450.0" dy="0.0">uv build --wheel</tspan><tspan x="450.0" dy="21.6">버전 0.1.0 휠 생성</tspan></text>
<polyline points="575,133 620,133" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
<rect x="620" y="80" width="250" height="105" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="745.0" y="110.9" font-size="16" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="745.0" dy="0.0">별도 가상환경에 설치</tspan><tspan x="745.0" dy="21.6">새 프로세스 import</tspan><tspan x="745.0" dy="21.6">반환: Agent Log</tspan></text>
<rect x="40" y="275" width="360" height="140" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="220.0" y="312.6" font-size="16" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="220.0" dy="0.0">Before: 같은 목록 공유</tspan><tspan x="220.0" dy="21.6">alpha 추가 → beta 추가</tspan><tspan x="220.0" dy="21.6">실제: [alpha, beta]</tspan><tspan x="220.0" dy="21.6">1 failed, 1 passed</tspan></text>
<rect x="500" y="275" width="360" height="140" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="680.0" y="312.6" font-size="16" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="680.0" dy="0.0">After: fixture로 새 목록</tspan><tspan x="680.0" dy="21.6">각 테스트는 빈 목록부터 시작</tspan><tspan x="680.0" dy="21.6">검사: [alpha] / [beta]</tspan><tspan x="680.0" dy="21.6">2 passed</tspan></text>
<polyline points="400,345 500,345" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
<rect x="415.0" y="318.0" width="70.0" height="24" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="450.0" y="330.0" font-size="14" fill="#1e40af" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450.0" dy="0.0">준비 분리</tspan></text>
<rect x="200" y="490" width="500" height="95" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="450.0" y="526.7" font-size="16" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450.0" dy="0.0">monkeypatch: 테스트 동안 값 변경</tspan><tspan x="450.0" dy="21.6">테스트가 끝나면 원래 설정으로 복원</tspan></text>
<text x="450" y="635.0" font-size="15" fill="#4b5563" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450" dy="0.0">파랑: 작성한 처리 · 초록: 소스·입력 · 노랑: 확인 · 빨강: 실패</tspan></text>
</svg>