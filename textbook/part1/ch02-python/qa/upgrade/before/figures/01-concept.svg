<svg style="min-width:900px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" role="img" aria-labelledby="title-01-concept desc-01-concept">
<title id="title-01-concept">변수 이름에서 계산 결과까지</title>
<desc id="desc-01-concept">변수 이름이 자료형이 있는 값을 가리키고, quantity 2와 unit_price 39000.0이 주문 금액 78000원을 만드는 흐름입니다.</desc>
<defs>
<marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
<marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect width="900" height="440" fill="#ffffff"/>
<text x="20" y="30.0" font-size="19" fill="#111827" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">변수 이름에서 계산 결과까지</tspan></text>
<text x="20" y="72.0" font-size="16" fill="#111827" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">서로 다른 이름이 값과 자료형을 가리킵니다</tspan></text>
<rect x="25" y="100" width="195" height="82" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="122.5" y="130.2" font-size="16" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="122.5" dy="0.0">product_name</tspan><tspan x="122.5" dy="21.6">&quot;무선 키보드&quot; · str</tspan></text>
<rect x="245" y="100" width="195" height="82" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="342.5" y="130.2" font-size="16" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="342.5" dy="0.0">quantity</tspan><tspan x="342.5" dy="21.6">2 · int</tspan></text>
<rect x="465" y="100" width="195" height="82" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="562.5" y="130.2" font-size="16" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="562.5" dy="0.0">unit_price</tspan><tspan x="562.5" dy="21.6">39000.0 · float</tspan></text>
<rect x="685" y="100" width="190" height="82" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="780.0" y="130.2" font-size="16" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="780.0" dy="0.0">is_member</tspan><tspan x="780.0" dy="21.6">True · bool</tspan></text>
<text x="450" y="235.0" font-size="16" fill="#92400e" text-anchor="middle" dominant-baseline="middle" font-weight="bold"><tspan x="450" dy="0.0">quantity × unit_price</tspan></text>
<polyline points="342,182 342,250 410,285" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
<polyline points="562,182 562,250 490,285" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
<rect x="335" y="285" width="230" height="72" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="450.0" y="309.5" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450.0" dy="0.0">order_total</tspan><tspan x="450.0" dy="23.0">78000.0 → 78000원</tspan></text>
<text x="450.0" y="414.0" font-size="14" fill="#4b5563" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450.0" dy="0.0">파랑: 작성한 흐름 · 초록: 데이터 · 노랑: 확인 · 빨강: 실패</tspan></text>
