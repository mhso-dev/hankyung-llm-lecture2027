<svg style="min-width:900px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 880" width="900" height="880" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" role="img" aria-labelledby="title-12-concept desc-12-concept">
<title id="title-12-concept">대기 방식과 작업 실행 순서를 나누어 확인합니다</title>
<desc id="desc-12-concept">위에서 아래로 읽습니다. 위쪽은 순차·동시 대기, 아래쪽은 같은 동기 대기를 호출하는 위치의 비교입니다.</desc>
<defs>
<marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
<marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect width="900" height="880" fill="#ffffff"/>
<text x="20" y="30.0" font-size="19" fill="#111827" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">대기 방식과 작업 실행 순서를 나누어 확인합니다</tspan></text>
<rect x="40" y="80" width="370" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="225.0" y="108.4" font-size="16" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="225.0" dy="0.0">순차 await</tspan><tspan x="225.0" dy="21.6">A: 0.04초 대기 후</tspan><tspan x="225.0" dy="21.6">B: 0.04초 대기</tspan></text>
<rect x="490" y="80" width="370" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="675.0" y="108.4" font-size="16" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="675.0" dy="0.0">gather</tspan><tspan x="675.0" dy="21.6">A와 B의 대기를 함께 시작</tspan><tspan x="675.0" dy="21.6">두 작업이 끝나면 결과 반환</tspan></text>
<text x="450" y="235.0" font-size="16" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450" dy="0.0">별도 완료 순서 실습: 느린 작업 0.03초 · 빠른 작업 0.01초</tspan></text>
<rect x="40" y="280" width="370" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="225.0" y="314.2" font-size="16" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="225.0" dy="0.0">실제 완료 기록</tspan><tspan x="225.0" dy="21.6">빠른 작업 → 느린 작업</tspan></text>
<rect x="490" y="280" width="370" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="675.0" y="314.2" font-size="16" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="675.0" dy="0.0">gather 결과 목록</tspan><tspan x="675.0" dy="21.6">느린 작업 → 빠른 작업</tspan></text>
<rect x="40" y="455" width="820" height="105" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="450.0" y="485.9" font-size="16" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450.0" dy="0.0">Before: 이벤트 루프에서 time.sleep(0.05) 호출</tspan><tspan x="450.0" dy="21.6">관찰: block-start → block-end → heartbeat</tspan><tspan x="450.0" dy="21.6">동기 대기가 끝날 때까지 하트비트 실행이 지연됩니다.</tspan></text>
<rect x="40" y="635" width="820" height="105" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="450.0" y="665.9" font-size="16" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450.0" dy="0.0">After: to_thread로 같은 동기 대기를 별도 스레드에서 실행</tspan><tspan x="450.0" dy="21.6">관찰: wait-start → heartbeat → wait-end</tspan><tspan x="450.0" dy="21.6">스레드 작업을 기다리는 동안 하트비트가 실행되었습니다.</tspan></text>
<polyline points="450,560 450,635" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
<rect x="408.3" y="570.5" width="83.4" height="24" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="450.0" y="582.5" font-size="14" fill="#1e40af" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450.0" dy="0.0">호출 위치 변경</tspan></text>
<text x="450" y="790.0" font-size="15" fill="#4b5563" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450" dy="0.0">대기 시간은 실습 설정값입니다. 실행 시간과 사건 간격은 환경에 따라 달라집니다.</tspan></text>
<text x="450.0" y="854.0" font-size="14" fill="#4b5563" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450.0" dy="0.0">파랑: 작성한 흐름 · 초록: 데이터 · 노랑: 확인 · 빨강: 실패</tspan></text>
</svg>