<svg style="min-width:900px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" role="img" aria-labelledby="title-06-concept desc-06-concept">
<title id="title-06-concept">인스턴스마다 분리된 주문 상태</title>
<desc id="desc-06-concept">Order 설계로 만든 민지 주문과 준호 주문은 각각 다른 items 목록을 소유합니다.</desc>
<defs>
<marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
<marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect width="900" height="570" fill="#ffffff"/>
<text x="20" y="30.0" font-size="19" fill="#111827" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">인스턴스마다 분리된 주문 상태</tspan></text>
<text x="20" y="72.0" font-size="16" fill="#111827" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">하나의 클래스에서 서로 독립된 두 인스턴스를 만듭니다</tspan></text>
<rect x="335" y="95" width="230" height="82" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="450.0" y="124.5" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450.0" dy="0.0">Order 클래스</tspan><tspan x="450.0" dy="23.0">__init__ · add</tspan></text>
<polyline points="410,177 410,215 205,250" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
<rect x="252.8" y="186.5" width="109.5" height="24" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="307.5" y="198.5" font-size="14" fill="#1e40af" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="307.5" dy="0.0">Order(&quot;민지&quot;)</tspan></text>
<polyline points="490,177 490,215 695,250" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
<rect x="537.8" y="186.5" width="109.5" height="24" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="592.5" y="198.5" font-size="14" fill="#1e40af" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="592.5" dy="0.0">Order(&quot;준호&quot;)</tspan></text>
<rect x="25" y="250" width="360" height="88" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="205.0" y="282.5" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="205.0" dy="0.0">민지 first.items</tspan><tspan x="205.0" dy="23.0">['노트']</tspan></text>
<rect x="515" y="250" width="360" height="88" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="695.0" y="282.5" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="695.0" dy="0.0">준호 second.items</tspan><tspan x="695.0" dy="23.0">['연필']</tspan></text>
<polyline points="205,338 205,385" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
<rect x="128.6" y="334.5" width="152.9" height="24" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="205.0" y="346.5" font-size="14" fill="#1e40af" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="205.0" dy="0.0">first.add(&quot;지우개&quot;)</tspan></text>
<polyline points="695,338 695,385" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)" stroke-dasharray="7 5"/>
<rect x="648.9" y="334.5" width="92.1" height="24" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="695.0" y="346.5" font-size="14" fill="#1e40af" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="695.0" dy="0.0">민지 변경 뒤에도</tspan></text>
<rect x="25" y="385" width="360" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="205.0" y="418.5" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="205.0" dy="0.0">민지 최종 상태</tspan><tspan x="205.0" dy="23.0">['노트', '지우개']</tspan></text>
<rect x="515" y="385" width="360" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="695.0" y="418.5" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="695.0" dy="0.0">준호 최종 상태</tspan><tspan x="695.0" dy="23.0">['연필'] 유지</tspan></text>
<text x="450.0" y="544.0" font-size="14" fill="#4b5563" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450.0" dy="0.0">파랑: 작성한 흐름 · 초록: 데이터 · 노랑: 확인 · 빨강: 실패</tspan></text>
</svg>