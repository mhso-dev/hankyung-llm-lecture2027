<svg style="min-width:900px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" role="img" aria-labelledby="title-02-concept desc-02-concept">
<title id="title-02-concept">조건 선택과 반복 종료</title>
<desc id="desc-02-concept">주문 금액을 조건과 비교해 배송비 한 경로를 선택하고, 반복 중 0을 만나면 처리를 끝내는 흐름입니다.</desc>
<defs>
<marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
<marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect width="900" height="550" fill="#ffffff"/>
<text x="20" y="30.0" font-size="19" fill="#111827" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">조건 선택과 반복 종료</tspan></text>
<text x="20" y="72.0" font-size="16" fill="#111827" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">조건문: 참인 경로 하나를 선택합니다</tspan></text>
<rect x="25" y="100" width="205" height="78" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="127.5" y="127.5" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="127.5" dy="0.0">주문 금액</tspan><tspan x="127.5" dy="23.0">18000원</tspan></text>
<polyline points="230,139 315,139" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
<rect x="315" y="90" width="270" height="98" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="450.0" y="128.2" font-size="16" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450.0" dy="0.0">18000 &gt;= 50000 → 거짓</tspan><tspan x="450.0" dy="21.6">18000 &gt;= 30000 → 거짓</tspan></text>
<polyline points="585,139 675,139" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
<rect x="595.0" y="112.0" width="70.0" height="24" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="630.0" y="124.0" font-size="14" fill="#1e40af" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="630.0" dy="0.0">else</tspan></text>
<rect x="675" y="100" width="200" height="78" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="775.0" y="127.5" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="775.0" dy="0.0">배송비</tspan><tspan x="775.0" dy="23.0">3000원</tspan></text>
<text x="20" y="255.0" font-size="16" fill="#111827" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">반복문: 입력을 차례로 확인합니다</tspan></text>
<rect x="25" y="290" width="255" height="105" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="152.5" y="331.0" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="152.5" dy="0.0">18000, -1, 42000,</tspan><tspan x="152.5" dy="23.0">0, 65000</tspan></text>
<polyline points="280,342 335,342" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
<rect x="335" y="282" width="235" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="452.5" y="330.5" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="452.5" dy="0.0">-1이면 continue</tspan><tspan x="452.5" dy="23.0">0이면 break</tspan></text>
<polyline points="570,342 650,342" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
<rect x="572.6" y="315.0" width="74.8" height="24" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="610.0" y="327.0" font-size="14" fill="#1e40af" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="610.0" dy="0.0">0 뒤는 중단</tspan></text>
<rect x="650" y="290" width="225" height="105" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="762.5" y="331.0" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="762.5" dy="0.0">처리한 주문</tspan><tspan x="762.5" dy="23.0">[18000, 42000]</tspan></text>
<text x="450.0" y="524.0" font-size="14" fill="#4b5563" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450.0" dy="0.0">파랑: 작성한 흐름 · 초록: 데이터 · 노랑: 확인 · 빨강: 실패</tspan></text>
</svg>