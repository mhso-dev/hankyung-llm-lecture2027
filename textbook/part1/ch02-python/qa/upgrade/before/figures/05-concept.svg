<svg style="min-width:900px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" role="img" aria-labelledby="title-05-concept desc-05-concept">
<title id="title-05-concept">UTF-8 파일 읽기와 누락 파일 처리</title>
<desc id="desc-05-concept">정상 파일은 줄 목록과 주문 튜플로 변환하고, 누락 파일은 FileNotFoundError만 처리하여 빈 목록을 반환합니다.</desc>
<defs>
<marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
<marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect width="900" height="550" fill="#ffffff"/>
<text x="20" y="30.0" font-size="19" fill="#111827" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">UTF-8 파일 읽기와 누락 파일 처리</tspan></text>
<text x="20" y="72.0" font-size="16" fill="#111827" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">같은 읽기 함수가 파일 존재 여부에 따라 갈라집니다</tspan></text>
<rect x="335" y="95" width="230" height="78" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="450.0" y="122.5" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450.0" dy="0.0">read_items(path)</tspan><tspan x="450.0" dy="23.0">UTF-8 읽기</tspan></text>
<polyline points="420,173 420,210 205,245" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
<rect x="262.1" y="182.0" width="100.8" height="24" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="312.5" y="194.0" font-size="14" fill="#1e40af" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="312.5" dy="0.0">orders.txt</tspan></text>
<polyline points="480,173 480,210 695,245" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#m-red)"/>
<rect x="532.8" y="182.0" width="109.5" height="24" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="587.5" y="194.0" font-size="14" fill="#991b1b" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="587.5" dy="0.0">missing.txt</tspan></text>
<rect x="25" y="245" width="360" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="205.0" y="278.5" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="205.0" dy="0.0">정상 파일</tspan><tspan x="205.0" dy="23.0">['연필,3', '노트,2']</tspan></text>
<polyline points="205,335 205,380" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
<rect x="150.3" y="330.5" width="109.5" height="24" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="205.0" y="342.5" font-size="14" fill="#1e40af" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="205.0" dy="0.0">parse_order</tspan></text>
<rect x="25" y="380" width="360" height="82" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="205.0" y="410.2" font-size="16" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="205.0" dy="0.0">주문 튜플</tspan><tspan x="205.0" dy="21.6">[('연필', 3), ('노트', 2)]</tspan></text>
<rect x="515" y="245" width="360" height="90" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="695.0" y="278.5" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="695.0" dy="0.0">누락 파일</tspan><tspan x="695.0" dy="23.0">FileNotFoundError</tspan></text>
<polyline points="695,335 695,380" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
<rect x="648.9" y="330.5" width="92.1" height="24" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="695.0" y="342.5" font-size="14" fill="#1e40af" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="695.0" dy="0.0">해당 예외만 처리</tspan></text>
<rect x="515" y="380" width="360" height="82" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="695.0" y="409.5" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="695.0" dy="0.0">read_items_or_empty()</tspan><tspan x="695.0" dy="23.0">[] 반환</tspan></text>
<text x="450.0" y="524.0" font-size="14" fill="#4b5563" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450.0" dy="0.0">파랑: 작성한 흐름 · 초록: 데이터 · 노랑: 확인 · 빨강: 실패</tspan></text>
</svg>