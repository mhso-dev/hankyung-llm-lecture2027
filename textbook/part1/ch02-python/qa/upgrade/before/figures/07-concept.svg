<svg style="min-width:900px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" role="img" aria-labelledby="title-07-concept desc-07-concept">
<title id="title-07-concept">모듈 가져오기와 타입힌트의 범위</title>
<desc id="desc-07-concept">학생이 pricing 모듈을 작성해 실행하고, 타입힌트 정보와 실제 값 검증을 구분합니다.</desc>
<defs>
<marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
<marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect width="900" height="570" fill="#ffffff"/>
<text x="20" y="30.0" font-size="19" fill="#111827" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">모듈 가져오기와 타입힌트의 범위</tspan></text>
<text x="20" y="72.0" font-size="16" fill="#111827" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">모듈 작성과 실행</tspan></text>
<rect x="25" y="100" width="245" height="88" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="147.5" y="132.5" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="147.5" dy="0.0">pricing.py</tspan><tspan x="147.5" dy="23.0">add_tax 정의</tspan></text>
<polyline points="270,144 330,144" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
<rect x="330" y="100" width="240" height="88" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="450.0" y="133.2" font-size="16" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450.0" dy="0.0">from pricing import add_tax</tspan><tspan x="450.0" dy="21.6">10000, 0.1 전달</tspan></text>
<polyline points="570,144 635,144" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
<rect x="635" y="100" width="240" height="88" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="755.0" y="132.5" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="755.0" dy="0.0">반환값</tspan><tspan x="755.0" dy="23.0">11000</tspan></text>
<text x="20" y="250.0" font-size="16" fill="#111827" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">타입힌트 정보와 실행 시 검증은 서로 다릅니다</tspan></text>
<rect x="25" y="285" width="250" height="105" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="150.0" y="326.7" font-size="16" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="150.0" dy="0.0">타입힌트 정보</tspan><tspan x="150.0" dy="21.6">int 입력 → int 반환</tspan></text>
<rect x="325" y="285" width="250" height="105" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="450.0" y="315.9" font-size="16" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450.0" dy="0.0">double_total('1200')</tspan><tspan x="450.0" dy="21.6">'12001200'</tspan><tspan x="450.0" dy="21.6">자동 검증 없음</tspan></text>
<polyline points="575,338 635,338" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
<rect x="570.0" y="311.0" width="70.0" height="24" rx="4" fill="#ffffff" opacity="0.94"/>
<text x="605.0" y="323.0" font-size="14" fill="#1e40af" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="605.0" dy="0.0">int 변환</tspan></text>
<rect x="635" y="285" width="240" height="105" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="755.0" y="326.0" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="755.0" dy="0.0">double_total(1200)</tspan><tspan x="755.0" dy="23.0">2400</tspan></text>
<text x="25" y="440.0" font-size="14" fill="#4b5563" text-anchor="start" dominant-baseline="middle" font-weight="normal"><tspan x="25" dy="0.0">타입힌트 표시는 실행 전에 입력값을 자동 변환하거나 거부하지 않습니다.</tspan></text>
<text x="450.0" y="544.0" font-size="14" fill="#4b5563" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450.0" dy="0.0">파랑: 작성한 흐름 · 초록: 데이터 · 노랑: 확인 · 빨강: 실패</tspan></text>
</svg>