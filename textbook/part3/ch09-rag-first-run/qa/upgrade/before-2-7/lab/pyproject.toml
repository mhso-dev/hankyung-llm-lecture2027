[project]
name = "ch09-rag-first-run"
version = "0.1.0"
description = "Ch 9 RAG 첫 완주 + 실험 하네스"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=1.4,<1.5",
    "langchain-openai>=1.6",
    "langchain-community>=0.4",
    "langchain-text-splitters>=1.1",
    "pypdf>=6",
    "python-dotenv>=1.1",
    "pyyaml>=6",
    "tiktoken>=0.9",
]

[dependency-groups]
dev = ["pip==26.2", 
  "ipykernel==7.3.0", "pytest>=8", "ruff>=0.12"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
