<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" role="img" aria-label="설정을 하나 바꾸고 결과를 한 줄로 남기는 반복 실험">
<defs>
<marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a9eed"/></marker>
<marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker>
<marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
<marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker>
<marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#757575"/></marker>
</defs>
<rect width="800" height="470" fill="#ffffff"/>
<text x="20" y="30.0" font-size="18" fill="#1e1e1e" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">설정을 하나 바꾸고 결과를 한 줄로 남기는 반복 실험</tspan></text>
<rect x="40" y="100" width="170" height="80" rx="10" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
<text x="125.0" y="130.6" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="125.0" dy="0.0">설정 딕셔너리</tspan><tspan x="125.0" dy="18.9">청크 크기 · k · 모델</tspan></text>
<polyline points="210,140 270,140" fill="none" stroke="#4a9eed" stroke-width="2" marker-end="url(#m-blue)"/>
<text x="240" y="88.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="240" dy="0.0">k만 1 → 2</tspan></text>
<rect x="270" y="100" width="170" height="80" rx="10" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
<text x="355.0" y="130.6" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="355.0" dy="0.0">색인 설정을 JSON으로 바꾸고</tspan><tspan x="355.0" dy="18.9">해시 만들기</tspan></text>
<polyline points="355,180 355,230" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#m-green)" stroke-dasharray="7 5"/>
<rect x="293.6" y="182.5" width="122.8" height="21.0" fill="#ffffff" fill-opacity="0.9" rx="4"/>
<text x="355.0" y="193.0" font-size="14" fill="#166534" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="355.0" dy="0.0">해시가 같으면 다시 쓰기</tspan></text>
<rect x="270" y="230" width="170" height="70" rx="10" fill="#c3fae8" stroke="#22c55e" stroke-width="2"/>
<text x="355.0" y="255.6" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="355.0" dy="0.0">cache 딕셔너리</tspan><tspan x="355.0" dy="18.9">이미 만든 벡터스토어</tspan></text>
<polyline points="440,140 500,140" fill="none" stroke="#4a9eed" stroke-width="2" marker-end="url(#m-blue)"/>
<text x="470" y="88.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="470" dy="0.0">질문 검색</tspan></text>
<rect x="500" y="100" width="150" height="80" rx="10" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
<text x="575.0" y="130.6" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="575.0" dy="0.0">저장된 벡터스토어에서</tspan><tspan x="575.0" dy="18.9">k=2로 검색</tspan></text>
<polyline points="575,180 575,230" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#m-yellow)"/>
<rect x="480" y="230" width="190" height="70" rx="10" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/>
<text x="575.0" y="255.6" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="575.0" dy="0.0">임시 runs.jsonl에 한 줄</tspan><tspan x="575.0" dy="18.9">설정 · 해시 · 재사용 여부 · 검색 ID</tspan></text>
<rect x="480" y="320" width="190" height="60" rx="10" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/>
<text x="575.0" y="340.6" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="575.0" dy="0.0">저장한 한 줄을 다시 읽고</tspan><tspan x="575.0" dy="18.9">원래 딕셔너리와 비교</tspan></text>
<polyline points="575,300 575,320" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#m-yellow)"/>
<rect x="690" y="230" width="90" height="70" rx="10" fill="#fff3bf" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>
<text x="735.0" y="255.6" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="735.0" dy="0.0">품질 점수</tspan><tspan x="735.0" dy="18.9">Ch 11에서 추가</tspan></text>
<polyline points="480,280 455,280 455,335 125,335 125,180" fill="none" stroke="#4a9eed" stroke-width="2" marker-end="url(#m-blue)" stroke-dasharray="7 5"/>
<text x="290" y="355.0" font-size="14" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="290" dy="0.0">기록을 읽고 → 다음 설정 하나를 바꾸고 → 다시 실행</tspan></text>
<text x="40" y="420.0" font-size="14" fill="#757575" text-anchor="start" dominant-baseline="middle" font-weight="normal"><tspan x="40" dy="0.0">같은 순서로 기록하면 어떤 설정에서 어떤 결과가 나왔는지 나중에 비교할 수 있다.</tspan></text>
<text x="40" y="445.0" font-size="14" fill="#757575" text-anchor="start" dominant-baseline="middle" font-weight="normal"><tspan x="40" dy="0.0">지금 기록에는 품질 점수가 없다. Ch 11에서 검색 결과를 평가하는 점수를 추가한다.</tspan></text>
</svg>