<text x="395.0" y="223.0" font-size="14" fill="#991b1b" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="395.0" dy="0.0">검색 실패·정답 누락</tspan></text>
<polyline points="340,255 450,360" fill="none" stroke="#757575" stroke-width="2" marker-end="url(#m-gray)"/>
