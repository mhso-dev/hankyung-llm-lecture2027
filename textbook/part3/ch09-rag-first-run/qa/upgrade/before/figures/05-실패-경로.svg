<text x="700.0" y="109.9" font-size="15" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="700.0" dy="0.0">규정 답 + 근거</tspan><tspan x="700.0" dy="20.2">ANSWER</tspan></text>
<rect x="610" y="190" width="180" height="215" rx="12" fill="#fff8dc" fill-opacity="0.35" stroke="#f59e0b" stroke-width="1"/>
<rect x="620" y="200" width="160" height="70" rx="10" fill="#ffc9c9" stroke="#ef4444" stroke-width="2"/>
<text x="700.0" y="225.6" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="700.0" dy="0.0">"찾을 수 없습니다"</tspan><tspan x="700.0" dy="18.9">또는 지어낸 숫자</tspan></text>
<rect x="620" y="325" width="160" height="70" rx="10" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/>
<text x="700.0" y="350.6" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="700.0" dy="0.0">"찾을 수 없습니다"</tspan><tspan x="700.0" dy="18.9">(올바른 답)</tspan></text>
<text x="40" y="440.0" font-size="14" fill="#1e1e1e" text-anchor="start" dominant-baseline="middle" font-weight="normal"><tspan x="40" dy="0.0">두 경우 모두 같은 거부 문장이 나올 수 있다. 검색된 문서 ID를 보면 원인을 구분할 수 있다.</tspan></text>
<text x="40" y="465.0" font-size="14" fill="#757575" text-anchor="start" dominant-baseline="middle" font-weight="normal"><tspan x="40" dy="0.0">'찾을 수 없습니다'라는 지시는 검색에서 빠진 정답 문서를 다시 가져오지 못한다.</tspan></text>
<text x="40" y="490.0" font-size="14" fill="#757575" text-anchor="start" dominant-baseline="middle" font-weight="normal"><tspan x="40" dy="0.0">검색 문제는 검색된 문서 ID와 본문을 먼저 확인해 찾아낸다.</tspan></text>
