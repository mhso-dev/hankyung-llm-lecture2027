<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 190" role="img" aria-labelledby="title desc">
<title id="title">관련도에서 0~1 정규화까지의 흐름</title><desc id="desc">세 단계가 왼쪽에서 오른쪽으로 이어집니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#6b7280"/></marker></defs>
<rect width="650" height="190" fill="#ffffff"/><rect x="30" y="55" width="170" height="80" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="115" y="102" text-anchor="middle" font-size="18" fill="#1f2937">관련도</text><path d="M 200 95 L 235 95" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/><rect x="240" y="55" width="170" height="80" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><text x="325" y="102" text-anchor="middle" font-size="18" fill="#1f2937">순위 할인</text><path d="M 410 95 L 445 95" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/><rect x="450" y="55" width="170" height="80" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="535" y="102" text-anchor="middle" font-size="18" fill="#1f2937">0~1 정규화</text>
<text x="325" y="170" text-anchor="middle" font-size="14" fill="#4b5563">한 단계의 출력이 다음 단계의 입력이 됩니다.</text></svg>