<text x="450" y="390.0" font-size="15" fill="#595959" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450" dy="0.0">형식의 구조를 보존하면 청킹 기준과 출처 표시를 문서 유형에 맞게 선택할 수 있습니다.</tspan></text>
