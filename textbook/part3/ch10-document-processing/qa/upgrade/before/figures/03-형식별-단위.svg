<text x="440.0" y="303.1" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="440.0" dy="0.0">머리글이 붙은 행</tspan><tspan x="440.0" dy="18.9">행 번호 · 열 이름</tspan></text>
