<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">문서 형식마다 의미 있는 단위가 다르다</title>
<desc id="desc">DOCX는 문단과 표, HTML은 제목과 본문, CSV는 머리글이 붙은 행으로 변환되는 세 경로</desc>
<defs>
