<text x="440.0" y="113.0" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="440.0" dy="0.0">문단 + 표</tspan><tspan x="440.0" dy="18.9">스타일 · 표 위치 메타데이터</tspan></text>
