<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">HWP와 HWPX는 확장자뿐 아니라 내부 구조가 다르다</title>
<desc id="desc">HWP는 전용 파서가 필요하다고 분류하고 HWPX는 ZIP 안의 본문 XML을 읽습니다. Document 변환은 후속 단계입니다.</desc>
<defs>
<marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a9eed"/></marker>
<marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker>
<marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
<marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker>
<marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#757575"/></marker>
</defs>
<rect width="900" height="430" fill="#ffffff"/>
<text x="20" y="30.0" font-size="18" fill="#1e1e1e" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">HWP와 HWPX는 확장자뿐 아니라 내부 구조가 다르다</tspan></text>
<rect x="45" y="165" width="145" height="75" rx="10" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
<text x="117.5" y="202.5" font-size="16" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="117.5" dy="0.0">한글 문서</tspan></text>
<polyline points="190,202 285,202" fill="none" stroke="#4a9eed" stroke-width="2" marker-end="url(#m-blue)"/>
<rect x="285" y="165" width="145" height="75" rx="10" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
<text x="357.5" y="193.1" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="357.5" dy="0.0">형식 판별</tspan><tspan x="357.5" dy="18.9">확장자 + 매직 바이트</tspan></text>
<polyline points="430,185 535,115" fill="none" stroke="#4a9eed" stroke-width="2" marker-end="url(#m-blue)"/>
<rect x="449.9" y="127.5" width="65.2" height="21.0" fill="#ffffff" fill-opacity="0.94" rx="4"/>
<text x="482.5" y="138.0" font-size="14" fill="#1e40af" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="482.5" dy="0.0">.hwp</tspan></text>
<polyline points="430,220 535,300" fill="none" stroke="#4a9eed" stroke-width="2" marker-end="url(#m-blue)"/>
<rect x="443.2" y="237.5" width="78.5" height="21.0" fill="#ffffff" fill-opacity="0.94" rx="4"/>
<text x="482.5" y="248.0" font-size="14" fill="#1e40af" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="482.5" dy="0.0">.hwpx</tspan></text>
<rect x="535" y="60" width="250" height="130" rx="12" fill="#ffe3e3" fill-opacity="0.35" stroke="#ef4444" stroke-width="1"/>
<text x="549" y="78.0" font-size="15" fill="#991b1b" text-anchor="start" dominant-baseline="middle" font-weight="normal"><tspan x="549" dy="0.0">HWP 경로</tspan></text>
<rect x="560" y="105" width="200" height="60" rx="10" fill="#ffc9c9" stroke="#ef4444" stroke-width="2"/>
<text x="660.0" y="125.5" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="660.0" dy="0.0">미지원으로 분류</tspan><tspan x="660.0" dy="18.9">전용 파서 필요</tspan></text>
<rect x="535" y="245" width="250" height="130" rx="12" fill="#d3f9d8" fill-opacity="0.35" stroke="#22c55e" stroke-width="1"/>
<text x="549" y="263.0" font-size="15" fill="#166534" text-anchor="start" dominant-baseline="middle" font-weight="normal"><tspan x="549" dy="0.0">HWPX 경로</tspan></text>
<rect x="560" y="290" width="200" height="60" rx="10" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
<text x="660.0" y="310.6" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="660.0" dy="0.0">본문 XML만 선택</tspan><tspan x="660.0" dy="18.9">문자열 추출</tspan></text>
<polyline points="760,135 805,190" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#m-green)"/>
<polyline points="760,320 805,225" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#m-green)"/>
<rect x="805" y="175" width="85" height="65" rx="10" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
<text x="847.5" y="188.6" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="847.5" dy="0.0">후속 단계</tspan><tspan x="847.5" dy="18.9">Document</tspan><tspan x="847.5" dy="18.9">변환</tspan></text>
<text x="450" y="405.0" font-size="14" fill="#595959" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450" dy="0.0">HWPX를 일반 XML 파일로 가정하거나 HWP를 텍스트 파일처럼 열면 본문 순서를 복원할 수 없습니다.</tspan></text>
</svg>