<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">같은 원문을 문자·재귀·토큰 기준으로 나누기</title>
<desc id="desc">같은 문서를 문자 수, 토큰 수, 재귀 구분자 기준으로 자르는 방법과 겹침 구간을 비교한 도식</desc>
<defs>
<marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a9eed"/></marker>
<marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker>
<marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
<marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker>
<marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#757575"/></marker>
</defs>
<rect width="900" height="470" fill="#ffffff"/>
<text x="20" y="30.0" font-size="18" fill="#1e1e1e" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">같은 원문을 문자·재귀·토큰 기준으로 나누기</tspan></text>
<rect x="45" y="75" width="810" height="55" rx="10" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
<text x="450.0" y="102.5" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450.0" dy="0.0">원문: 첫 문단 …… 문장 A. 문장 B. …… 둘째 문단 …… 문장 C.</tspan></text>
<rect x="45" y="165" width="250" height="205" rx="12" fill="#dbe4ff" fill-opacity="0.35" stroke="#4a9eed" stroke-width="1"/>
<text x="59" y="183.0" font-size="15" fill="#1e40af" text-anchor="start" dominant-baseline="middle" font-weight="normal"><tspan x="59" dy="0.0">문자 수 기준</tspan></text>
<rect x="70" y="220" width="125" height="60" rx="10" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
<text x="132.5" y="250.0" font-size="16" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="132.5" dy="0.0">목표 35자</tspan></text>
<rect x="145" y="290" width="125" height="60" rx="10" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/>
<text x="207.5" y="320.0" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="207.5" dy="0.0">겹침 5자</tspan></text>
<rect x="325" y="165" width="250" height="205" rx="12" fill="#dbe4ff" fill-opacity="0.35" stroke="#4a9eed" stroke-width="1"/>
<text x="339" y="183.0" font-size="15" fill="#1e40af" text-anchor="start" dominant-baseline="middle" font-weight="normal"><tspan x="339" dy="0.0">토큰 수 기준</tspan></text>
<rect x="350" y="220" width="125" height="60" rx="10" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
<text x="412.5" y="250.0" font-size="16" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="412.5" dy="0.0">목표 20토큰</tspan></text>
<rect x="425" y="290" width="125" height="60" rx="10" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/>
<text x="487.5" y="320.0" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="487.5" dy="0.0">겹침 4토큰</tspan></text>
<rect x="605" y="165" width="250" height="205" rx="12" fill="#d3f9d8" fill-opacity="0.35" stroke="#22c55e" stroke-width="1"/>
<text x="619" y="183.0" font-size="15" fill="#166534" text-anchor="start" dominant-baseline="middle" font-weight="normal"><tspan x="619" dy="0.0">재귀 구분자 기준</tspan></text>
<rect x="630" y="220" width="200" height="60" rx="10" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
<text x="730.0" y="240.6" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="730.0" dy="0.0">문단 → 문장 → 공백</tspan><tspan x="730.0" dy="18.9">→ 문자 순으로 분할</tspan></text>
<rect x="655" y="300" width="150" height="45" rx="10" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
<text x="730.0" y="322.5" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="730.0" dy="0.0">35자 → 50자 비교</tspan></text>
<text x="450" y="420.0" font-size="15" fill="#595959" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="450" dy="0.0">겹침은 경계의 문맥을 남기지만, 중복 문장이 늘어 처리량이 커질 수 있습니다.</tspan></text>
</svg>