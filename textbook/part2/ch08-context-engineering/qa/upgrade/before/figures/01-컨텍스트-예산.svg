<text x="55" y="330.0" font-size="18" fill="#92400e" text-anchor="start" dominant-baseline="middle" font-weight="normal"><tspan x="55" dy="0.0">근거를 추가하면 다른 영역의 예산이 줄어듭니다.</tspan></text>
