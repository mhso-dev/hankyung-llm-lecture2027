</defs>
<rect width="800" height="390" fill="#ffffff"/>
<text x="20" y="32.0" font-size="20" fill="#1e293b" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">고정된 컨텍스트 한도 안에서 예산을 배분합니다</tspan></text>
<rect x="35" y="72" width="730" height="220" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
