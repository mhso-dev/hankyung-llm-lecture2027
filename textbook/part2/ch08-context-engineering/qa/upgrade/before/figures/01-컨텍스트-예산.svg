<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif" role="img" aria-label="고정된 컨텍스트 한도 안에서 예산을 배분합니다">
<title>고정된 컨텍스트 한도 안에서 예산을 배분합니다</title>
<defs>
