<rect x="190" y="130" width="110" height="105" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="245.0" y="170.3" font-size="18" fill="#1e293b" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="245.0" dy="0.0">질문</tspan><tspan x="245.0" dy="24.3">10%</tspan></text>
<rect x="310" y="130" width="195" height="105" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="407.5" y="170.3" font-size="18" fill="#1e293b" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="407.5" dy="0.0">근거</tspan><tspan x="407.5" dy="24.3">36%</tspan></text>
<rect x="515" y="130" width="135" height="105" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="582.5" y="170.3" font-size="18" fill="#1e293b" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="582.5" dy="0.0">출력 예약</tspan><tspan x="582.5" dy="24.3">26%</tspan></text>
<rect x="660" y="130" width="85" height="105" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/>
