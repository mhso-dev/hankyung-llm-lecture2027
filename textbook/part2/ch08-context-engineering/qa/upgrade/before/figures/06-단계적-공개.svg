<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif" role="img" aria-label="단계적 공개는 목록에서 필요한 본문만 선택합니다">
<title>단계적 공개는 목록에서 필요한 본문만 선택합니다</title>
<defs>
<marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
<marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
<marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
</defs>
<rect width="800" height="410" fill="#ffffff"/>
<text x="20" y="32.0" font-size="20" fill="#1e293b" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">단계적 공개는 목록에서 필요한 본문만 선택합니다</tspan></text>
<rect x="35" y="145" width="155" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="112.5" y="177.8" font-size="18" fill="#1e293b" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="112.5" dy="0.0">문서 목록</tspan><tspan x="112.5" dy="24.3">제목·요약</tspan></text>
<polyline points="190,190 235,190" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#m-blue)"/>
<rect x="235" y="130" width="180" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="325.0" y="177.8" font-size="18" fill="#1e293b" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="325.0" dy="0.0">학생 규칙으로</tspan><tspan x="325.0" dy="24.3">관련 문서 선택</tspan></text>
<polyline points="415,190 465,190" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#m-blue)"/>
<rect x="465" y="145" width="135" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="532.5" y="177.8" font-size="18" fill="#1e293b" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="532.5" dy="0.0">선택한</tspan><tspan x="532.5" dy="24.3">문서 본문</tspan></text>
<polyline points="600,190 650,190" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#m-purple)"/>
<rect x="650" y="145" width="120" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="710.0" y="177.8" font-size="18" fill="#1e293b" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="710.0" dy="0.0">LLM</tspan><tspan x="710.0" dy="24.3">생성</tspan></text>
<text x="235" y="315.0" font-size="18" fill="#1d4ed8" text-anchor="start" dominant-baseline="middle" font-weight="normal"><tspan x="235" dy="0.0">Ch 9에서는 검색이 Select 단계를 자동화합니다.</tspan></text>
