<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" width="800" height="510" font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif" role="img" aria-label="압축은 조건과 출처를 보존하고 작업은 메시지로 분리합니다">
<title>압축은 조건과 출처를 보존하고 작업은 메시지로 분리합니다</title>
<defs>
<marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
<marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
<marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
</defs>
<rect width="800" height="510" fill="#ffffff"/>
<text x="20" y="32.0" font-size="20" fill="#1e293b" text-anchor="start" dominant-baseline="middle" font-weight="bold"><tspan x="20" dy="0.0">압축은 조건과 출처를 보존하고 작업은 메시지로 분리합니다</tspan></text>
<rect x="40" y="190" width="145" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="112.5" y="222.8" font-size="18" fill="#1e293b" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="112.5" dy="0.0">원문</tspan><tspan x="112.5" dy="24.3">조건·출처 포함</tspan></text>
<polyline points="185,235 235,235" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#m-blue)"/>
<rect x="235" y="175" width="170" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="320.0" y="222.8" font-size="18" fill="#1e293b" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="320.0" dy="0.0">업무별 선택·압축</tspan><tspan x="320.0" dy="24.3">조건과 출처 유지</tspan></text>
<polyline points="405,220 455,150" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#m-blue)"/>
<polyline points="405,250 455,330" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#m-blue)"/>
<rect x="455" y="110" width="130" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="520.0" y="139.2" font-size="16" fill="#1e293b" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="520.0" dy="0.0">메시지 A</tspan><tspan x="520.0" dy="21.6">대출 안내</tspan></text>
<rect x="455" y="290" width="130" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="520.0" y="319.2" font-size="16" fill="#1e293b" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="520.0" dy="0.0">메시지 B</tspan><tspan x="520.0" dy="21.6">휴관 안내</tspan></text>
<polyline points="585,150 635,150" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#m-purple)"/>
<polyline points="585,330 635,330" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#m-purple)"/>
<rect x="635" y="110" width="130" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="700.0" y="150.0" font-size="16" fill="#1e293b" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="700.0" dy="0.0">답 생성 A</tspan></text>
<rect x="635" y="290" width="130" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="700.0" y="330.0" font-size="16" fill="#1e293b" text-anchor="middle" dominant-baseline="middle" font-weight="normal"><tspan x="700.0" dy="0.0">답 생성 B</tspan></text>
<text x="235" y="440.0" font-size="18" fill="#b91c1c" text-anchor="start" dominant-baseline="middle" font-weight="normal"><tspan x="235" dy="0.0">메시지에 이름표를 붙여도 다른 자료의 접근을 막지는 못합니다.</tspan></text>
</svg>